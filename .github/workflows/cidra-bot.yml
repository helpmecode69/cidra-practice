name: CIDRA Bot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  repair:
    # Limited to the cidra-e2e* test branches so other failing branches do not spend credits.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && startsWith(github.event.workflow_run.head_branch, 'cidra-e2e') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      # Spend caps for one run: requests and total tokens.
      CIDRA_MAX_LLM_CALLS: "6"
      CIDRA_MAX_LLM_TOKENS: "30000"

    steps:
      # The commit whose CI failed, not the default branch's tip
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Run CIDRA
        uses: abhishekKokadwar/CIDRA@main
        with:
          api_key: ${{ secrets.CLAUDE_API_KEY }}
          base_url: https://api.anthropic.com/v1/
          model_analyze: claude-haiku-4-5
          model_fix: claude-haiku-4-5
          enable_pr_creation: 'true'
          # A personal access token, not the built-in one: GitHub does not start
          # workflows for a pull request opened with GITHUB_TOKEN, so the fix PR
          # would get no CI run.
          github_token: ${{ secrets.CIDRA_PAT }}
